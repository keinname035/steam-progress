name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Build only; upload happens in a single step below. electron-builder's own
      # publisher uploads in parallel and can create duplicate draft releases.
      - run: npx electron-builder --win --publish never
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/Steam-Progress-Setup-*.exe --title "Steam Progress ${GITHUB_REF_NAME#v}" --generate-notes
