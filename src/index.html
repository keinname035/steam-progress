<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https://cdn.cloudflare.steamstatic.com data:; style-src 'self'">
  <title>Steam Progress</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1><img src="icon.png" alt="" class="logo">Steam Progress</h1>
    <input id="search" data-i18n-ph="search">
    <select id="sort">
      <option value="progress" data-i18n="sort_progress"></option>
      <option value="remaining" data-i18n="sort_remaining"></option>
      <option value="playtime" data-i18n="sort_playtime"></option>
      <option value="last" data-i18n="sort_last"></option>
      <option value="name" data-i18n="sort_name"></option>
    </select>
    <button id="reload" data-i18n="reload"></button>
    <button id="settingsBtn" data-i18n="settings"></button>
  </header>
  <p id="status"></p>
  <main id="grid"></main>

  <dialog id="langDialog">
    <form method="dialog">
      <h2 data-i18n="lang_title"></h2>
      <p class="hint" data-i18n="lang_text"></p>
      <select id="langFirst"></select>
      <menu><button id="langOk" value="ok" data-i18n="continue"></button></menu>
    </form>
  </dialog>

  <dialog id="settings">
    <form method="dialog">
      <h2 data-i18n="settings_title"></h2>
      <label><span data-i18n="language"></span> <select id="langSelect"></select></label>
      <label><span data-i18n="api_key"></span> <input id="apiKey" type="password"></label>
      <label><span data-i18n="steam_id"></span> <input id="steamId"></label>
      <p class="hint" data-i18n="settings_hint"></p>
      <menu>
        <button value="cancel" data-i18n="cancel"></button>
        <button id="save" value="ok" data-i18n="save"></button>
      </menu>
    </form>
  </dialog>

  <dialog id="goalDialog">
    <form method="dialog">
      <h2 data-i18n="progress_title"></h2>
      <p id="goalGame" class="hint"></p>
      <label><span data-i18n="progress_q"></span> <input id="goalPct" type="text" inputmode="decimal" data-i18n-ph="progress_ph"></label>
      <p class="hint" data-i18n="progress_hint"></p>
      <menu>
        <button value="cancel" data-i18n="cancel"></button>
        <button id="goalClear" value="clear" data-i18n="reset"></button>
        <button id="goalSave" value="ok" data-i18n="save"></button>
      </menu>
    </form>
  </dialog>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
